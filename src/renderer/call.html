<!doctype html>
<!-- The bar over a call (Moshi's own; the platform's call page fills the rest of the window) -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Moshi call</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --line: rgba(0, 0, 0, 0.1);
        --button: rgba(0, 0, 0, 0.06);
        --button-hover: rgba(0, 0, 0, 0.12);
        --end: #ff3b30;
      }
      :root[data-theme='dark'] {
        --bg: #1c1c1e;
        --text: #f5f5f7;
        --muted: #98989d;
        --line: rgba(255, 255, 255, 0.12);
        --button: rgba(255, 255, 255, 0.1);
        --button-hover: rgba(255, 255, 255, 0.18);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.2 system-ui, 'Segoe UI', sans-serif; user-select: none; }
      #bar { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px 0 12px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
      #avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--button); color: var(--muted); display: grid; place-items: center; font-weight: 600; overflow: hidden; }
      #avatar img { width: 100%; height: 100%; object-fit: cover; }
      #who { min-width: 0; flex: 1; }
      #name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #sub { margin-top: 3px; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #clock { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
      button { -webkit-app-region: no-drag; flex: none; height: 28px; min-width: 28px; padding: 0 10px; border: 0; border-radius: 14px; background: var(--button); color: var(--text); font: inherit; cursor: pointer; transition: background 0.15s; }
      button:hover { background: var(--button-hover); }
      button:focus-visible { outline: 2px solid var(--end); outline-offset: 1px; }
      #end { background: var(--end); color: #fff; font-weight: 600; }
      #end:hover { background: #e0352b; }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <div id="bar">
      <div id="avatar" aria-hidden="true"></div>
      <div id="who"><div id="name"></div><div id="sub"></div></div>
      <div id="clock" role="timer"></div>
      <button id="min" type="button">&#8211;</button>
      <button id="end" type="button"></button>
    </div>
    <script type="module" src="/src/call-frame/main.ts"></script>
  </body>
</html>
