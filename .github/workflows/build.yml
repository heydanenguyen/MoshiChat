# Builds installers for every platform on GitHub's own machines (free for public repositories).
# Run it by hand from the Actions tab, or push a tag like v0.2.0. Downloads appear under the run's "Artifacts";
# tagged runs also publish them as a GitHub Release (notes from RELEASE_NOTES.md).
#
# Signing is optional: without certificate secrets, macOS builds are unsigned (users right-click → Open once)
# and Windows builds are unsigned (SmartScreen warning). To sign macOS: add CSC_LINK (base64 .p12),
# CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID as repository secrets.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The lockfile is written by npm 11; the runner ships npm 10, which resolves peers differently.
      - run: npm install -g npm@11
      - run: npm ci
      # Types first: a type error must stop the release, not ship in it.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Windows build
        shell: bash
        env:
          # GIF library key baked into the build (Settings → GIF works without setup). Optional.
          MOSHI_GIF_KEY: ${{ secrets.MOSHI_GIF_KEY }}
        # On failure the last 50 log lines become an annotation, readable without signing in.
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee build.log || { echo "::error title=Windows build failed::$(tail -n 50 build.log | cut -c1-300 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Moshi-windows
          # latest.yml and the blockmap let installed copies find and download this version in-app.
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # Apple Silicon
            arch: arm64
          - runner: macos-15-intel # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      # Unsigned until a certificate exists. To sign: add CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID as secrets, pass them here and drop this line.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The lockfile is written by npm 11; the runner ships npm 10, which resolves peers differently.
      - run: npm install -g npm@11
      - run: npm ci
      # Types first: a type error must stop the release, not ship in it.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: macOS build
        shell: bash
        env:
          MOSHI_GIF_KEY: ${{ secrets.MOSHI_GIF_KEY }}
        # On failure the last 50 log lines become an annotation, readable without signing in.
        run: |
          set -o pipefail
          npx electron-vite build && npx electron-builder --mac --${{ matrix.arch }} --publish never 2>&1 | tee build.log || { echo "::error title=macOS build failed::$(tail -n 50 build.log | cut -c1-300 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Moshi-mac-${{ matrix.arch }}
          # Only this runner's own architecture: native modules (sharp, onnxruntime) are installed for the
          # machine that runs npm ci, so a build for the other CPU made here would ship the wrong binaries.
          path: |
            dist/Moshi-*-mac-${{ matrix.arch }}.dmg
            dist/Moshi-*-mac-${{ matrix.arch }}.zip
            dist/Moshi-*-mac-${{ matrix.arch }}.zip.blockmap
            dist/latest-mac*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      # Checkout first: it cleans the workspace, which would wipe artifacts downloaded before it.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Each macOS runner writes its own latest-mac.yml (x64 or arm64). Uploaded as they are, one would
      # overwrite the other and Apple Silicon Macs would be offered the Intel build. Merge them into the
      # single file electron-updater expects, listing both architectures.
      - name: Merge macOS update metadata
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs'), path = require('path')
          const files = ['artifacts/Moshi-mac-x64/latest-mac.yml', 'artifacts/Moshi-mac-arm64/latest-mac.yml'].filter((f) => fs.existsSync(f))
          if (files.length < 2) { console.log('nothing to merge:', files); process.exit(0) }
          const entries = []
          let head = ''
          for (const f of files) {
            const text = fs.readFileSync(f, 'utf8')
            head ||= text
            for (const m of text.matchAll(/  - url: (.+)\n    sha512: (.+)\n    size: (\d+)/g)) entries.push({ url: m[1].trim(), sha512: m[2].trim(), size: m[3] })
            fs.unlinkSync(f)
          }
          const version = /^version: (.+)$/m.exec(head)[1].trim()
          const date = /^releaseDate: (.+)$/m.exec(head)[1].trim()
          const main = entries.find((e) => e.url.endsWith('.zip') && !/arm64/.test(e.url)) || entries[0]
          const out = ['version: ' + version, 'files:', ...entries.map((e) => `  - url: ${e.url}\n    sha512: ${e.sha512}\n    size: ${e.size}`), 'path: ' + main.url, 'sha512: ' + main.sha512, 'releaseDate: ' + date, '']
          fs.writeFileSync('artifacts/latest-mac.yml', out.join('\n'))
          console.log(fs.readFileSync('artifacts/latest-mac.yml', 'utf8'))
          JS
      # Published straight away: the in-app updater only sees published releases. The body comes from
      # RELEASE_NOTES.md at the tagged commit, so write the notes before tagging. A tag with a suffix
      # (v0.3.0-beta.1) is marked as a pre-release: installed stable versions never see it, while installed
      # betas (their version has a suffix) do, through the same latest.yml.
      - uses: softprops/action-gh-release@v2
        with:
          name: Moshi ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*
